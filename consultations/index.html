class ApiService {
  constructor() {
    this.state = { slots: [], appointments: [], notifications: [], rules: {} };
    this.role = 'student';
    this.token = '';
    this.demo = false;
    this.resetAvailable = false;
    this.revision = 0;
  }

  async init(token = '') {
    this.token = token;
    const response = await fetch('/api/config', { cache: 'no-store' });
    if (!response.ok) throw new Error('Python-сервер недоступен');
    const config = await response.json();
    this.demo = config.demo;
    this.resetAvailable = config.reset;
  }

  async request(path, method = 'GET', body) {
    const headers = {};
    if (this.demo) headers['X-Demo-Role'] = this.role;
    else if (this.token) headers.Authorization = `Bearer ${this.token}`;
    if (body !== undefined) headers['Content-Type'] = 'application/json';
    const response = await fetch(path, { method, headers, body: body === undefined ? undefined : JSON.stringify(body), credentials: 'same-origin', cache: 'no-store' });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
      const text = Array.isArray(data.detail) ? 'Проверьте заполнение полей формы.' : data.detail;
      throw new Error(text || `Ошибка сервера: ${response.status}`);
    }
    return data;
  }

  async setRole(role) {
    if (!this.demo && this.state.role && role !== this.state.role) throw new Error('Рабочую роль определяет сервер IT.Team.');
    this.role = role;
    await this.refresh();
  }

  async refresh() {
    const revision = ++this.revision;
    const view = await this.request('/api/v1/view');
    if (revision !== this.revision) return;
    this.state = view;
    SPECIALISTS = view.specialists.map(person => ({ ...presentation[person.id], ...person }));
    STUDENT = view.student;
  }

  async mutate(path, method, body) {
    const result = await this.request(path, method, body);
    await this.refresh();
    return result;
  }

  getSlot(id) { return this.state.slots.find(slot => slot.id === id); }
  getAppointment(id) { return this.state.appointments.find(item => item.id === id); }
  appointmentsForStudent() { return this.state.appointments; }
  appointmentsForSpecialist() { return this.state.appointments; }
  isOccupied(id) { return this.getSlot(id)?.occupied ?? true; }
  availableSlots(id, exceptId = null) {
    const current = this.getAppointment(exceptId);
    return this.state.slots.filter(slot => slot.specialistId === id && !slot.hidden && slotInstant(slot) > new Date() && (slot.available || (current && [current.slotId, current.requestedSlotId].includes(slot.id)))).sort((a, b) => slotInstant(a) - slotInstant(b));
  }
  selectedSlot(id) {
    const slot = this.getSlot(id);
    if (!slot) throw new Error('Выберите время консультации.');
    return slot;
  }

  create(data) { return this.mutate('/api/v1/appointments', 'POST', { specialist_id: data.specialistId, slot_id: data.selectedSlotId, topic: data.topic, private_comment: data.privateComment }); }

  complete(id) { return this.mutate(`/api/v1/admin/appointments/${encoded(id)}`, 'PATCH', { action: 'complete' }); }
  move(id, _specialist, slot) { return this.mutate(`/api/v1/admin/appointments/${encoded(id)}/move`, 'POST', { slot_id: slot }); }
  saveNotes(id, _specialist, notes) { return this.mutate(`/api/v1/admin/appointments/${encoded(id)}/notes`, 'PATCH', { notes }); }
  addSlot(specialist, day, time) { return this.mutate(`/api/v1/admin/specialists/${encoded(specialist)}/slots`, 'POST', { day, time }); }
  updateSlot(id, _specialist, day, time) { return this.mutate(`/api/v1/admin/slots/${encoded(id)}`, 'PATCH', { day, time }); }
  removeSlot(id) { return this.mutate(`/api/v1/admin/slots/${encoded(id)}`, 'DELETE'); }
  closeDay(specialist, day) { return this.mutate(`/api/v1/admin/specialists/${encoded(specialist)}/days/${day}`, 'DELETE'); }
  async generateSchedule(specialist, rules, from, until) {
    const result = await this.mutate('/api/v1/admin/schedules', 'POST', { specialist_id: specialist, rules, from_day: from, until_day: until });
    return result.added;
  }
  markNotificationsRead() { return this.mutate('/api/v1/notifications/read', 'PATCH'); }
  reset() { return this.mutate('/api/demo/reset', 'POST'); }
}

  await service.setRole(role);
  if (version !== navigationVersion) return;

  ].map(([path, text, symbol, count]) => link(path, `${icon(symbol)}${text}${count}`, (route === path || (path.endsWith('specialists') && route.startsWith('book/'))) ? 'active' : '')).join('')}</nav>`;
}

function pageHeading() {
  if (role !== 'student') {
    const person = specialistById(role);
    const titles = { 'admin/overview': `Кабинет ${role === 'psychologist' ? 'психолога' : 'специалиста'}`, 'admin/appointments': 'Заявки на консультации', 'admin/schedule': 'Расписание приёма' };
    return `<div class="page-heading"><div><div class="eyebrow">${person.role} · IT.Бирюлево</div><h1>${titles[route] || titles['admin/overview']}</h1><p class="subtitle">${person.name} · ${person.room}</p></div><div class="heading-right">${avatar(person, 'small-avatar')}<span class="small muted">Личный кабинет</span></div></div>`;
  }
  const title = route.startsWith('book/') ? 'Запись на консультацию' : route === 'student/my' ? 'Мои консультации' : route === 'student/notifications' ? 'Уведомления' : 'Запись на консультацию';
  return `<div class="page-heading"><div><div class="eyebrow">ПОДДЕРЖКА В IT.МОСКВА</div><h1>${title}</h1>${route === 'student/specialists' ? '<p class="subtitle">Выбери специалиста и удобное время. Остальное мы подскажем.</p>' : ''}</div><div class="heading-right"><span class="icon-box">${icon('shield')}</span><span class="small muted">Здесь можно быть собой</span></div></div>`;
}

function content() {
  if (route === 'student/my') return myAppointments();
  if (route === 'student/notifications') return notifications();
  if (route === 'student/success') return success();
  if (route.startsWith('book/')) {
    const id = route.slice(5);
    if (!specialistById(id)) return empty('Специалист не найден', 'Вернись к списку специалистов.', link('student/specialists', 'К специалистам', 'btn'));
    prepareBooking(id);
    return bookingPage();
  }
  if (route === 'admin/overview') return adminOverview();
  if (route === 'admin/appointments') return adminAppointments();
  if (route === 'admin/schedule') return adminSchedule();
  return specialistsPage();
}

function specialistsPage() {
  return `<div class="section-heading"><h2>Специалисты колледжа</h2><span class="view-count">${SPECIALISTS.length} специалиста · очный приём</span></div><div class="specialists">${SPECIALISTS.map(person => {
    const first = service.availableSlots(person.id)[0];
    return `<article class="specialist-card"><div class="specialist-top">${avatar(person)}<span class="role-symbol">${icon(person.icon)}</span></div><div class="role">${person.role}</div><h3>${person.name}</h3><p class="description">${person.description}</p><div class="tags">${person.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}</div><div class="availability"><i></i>${first ? `Ближайшее: ${labelDate(first.day)}, ${first.time}` : 'Расписание уточняется'}</div>${link(`book/${person.id}`, `Выбрать время ${icon('arrow')}`, 'btn full')}</article>`;
  }).join('')}</div><div class="confidential">${icon('lock')}<div>Личный комментарий доступен только вам и выбранному специалисту.</div></div>`;
}

function prepareBooking(id) {
  if (selectedSpecialist === id && booking.day) return;
  selectedSpecialist = id;
  const first = service.availableSlots(id)[0];
  booking = { day: first?.day || today(), month: monthKey(first?.day || today()), slotId: '', topic: '', privateComment: '' };
}

function monthCalendar() {
  const monthStart = booking.month + '-01';
  const date = parseDate(monthStart);
  const offset = (date.getUTCDay() + 6) % 7;
  const total = new Date(Date.UTC(date.getUTCFullYear(), date.getUTCMonth() + 1, 0)).getUTCDate();
  const availableDays = new Set(service.availableSlots(selectedSpecialist).map(slot => slot.day));
  const caption = date.toLocaleDateString('ru-RU', { month: 'long', year: 'numeric', timeZone: 'Europe/Moscow' });
  return `<div><div class="month-header"><strong>${caption}</strong><div class="month-nav"><button class="icon-button" data-month-shift="-1" aria-label="Предыдущий месяц" ${booking.month <= monthKey(today()) ? 'disabled' : ''}>${icon('back')}</button><button class="icon-button" data-month-shift="1" aria-label="Следующий месяц" ${booking.month >= monthKey(addDays(today(), 90)) ? 'disabled' : ''}>${icon('chevron')}</button></div></div><div class="month-grid">${weekdayNames.map(day => `<span class="weekday">${day}</span>`).join('')}${Array.from({ length: offset }, () => '<span></span>').join('')}${Array.from({ length: total }, (_, index) => {
    const day = booking.month + '-' + String(index + 1).padStart(2, '0');
    const available = availableDays.has(day);
    return `<button class="date-button ${available ? 'available' : ''} ${day === booking.day ? 'selected' : ''} ${day === today() ? 'today' : ''}" data-booking-day="${day}" aria-label="${fullDate(day)}${available ? ', доступно время' : ', свободного времени нет'}" aria-pressed="${day === booking.day}" ${available ? '' : 'disabled'}>${index + 1}</button>`;
  }).join('')}</div><div class="calendar-legend"><i></i>Есть свободное время</div></div>`;
}

function timeSlots() {
  const slots = service.state.slots.filter(slot => !slot.hidden && slot.specialistId === selectedSpecialist && slot.day === booking.day).sort((a, b) => a.time.localeCompare(b.time));
  return `<div><h3 class="time-heading">${labelDate(booking.day)}</h3><div class="slots-grid">${slots.map(slot => {
    const unavailable = service.isOccupied(slot.id) || slotInstant(slot) <= new Date();
    return `<button class="time-slot ${booking.slotId === slot.id ? 'selected' : ''}" data-booking-slot="${slot.id}" aria-pressed="${booking.slotId === slot.id}" aria-label="${slot.time}${unavailable ? ', недоступно' : ''}" ${unavailable ? 'disabled' : ''}>${slot.time}</button>`;
  }).join('') || '<p class="small muted">На эту дату времени пока нет.</p>'}</div><p class="time-note">${icon('clock')} Консультация длится 45 минут.<br>Зачёркнутое время уже недоступно.</p></div>`;
}

function bookingPage() {
  const person = specialistById(selectedSpecialist);
  const slot = service.getSlot(booking.slotId);
  return `<a class="back-link" href="#student/specialists">${icon('back')} Все специалисты</a><div class="booking-layout"><aside class="panel specialist-profile">${avatar(person, 'large')}<h2>${person.name}</h2><p class="role">${person.role}</p><p class="description">${person.description}</p><div class="profile-details"><div class="row">${icon('pin')}IT.Бирюлево · ${person.room}</div><div class="row">${icon('clock')}45 минут · очная встреча</div><div class="row">${icon('shield')}Бесплатно для студентов</div></div><div class="tags">${person.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}</div></aside><div class="booking-main"><div class="steps"><div class="step done"><span>✓</span>Специалист</div><div class="step active"><span>2</span>Дата и время</div><div class="step"><span>3</span>Подтверждение</div></div><section class="panel"><div class="panel-title"><div><h2>Когда тебе удобно?</h2><p>Выбери дату и свободное время</p></div><span class="icon-box">${icon('calendar')}</span></div><div class="date-time-grid">${monthCalendar()}${timeSlots()}</div><div class="booking-divider"></div><form id="booking-form" data-form="booking"><div class="field"><label for="booking-topic">О чём хочешь поговорить? <span class="optional">необязательно</span></label><input id="booking-topic" name="topic" data-draft="topic" maxlength="140" value="${esc(booking.topic)}" placeholder="Например, адаптация в колледже"><small>Можно обсудить всё лично — заполнять это поле не нужно.</small></div>${person.id !== 'deputy' ? `<div class="field"><label for="booking-private">Личный комментарий <span class="optional">необязательно</span></label><textarea id="booking-private" name="privateComment" data-draft="privateComment" maxlength="600" placeholder="Только вымышленные сведения для показа">${esc(booking.privateComment)}</textarea><small>В рабочем сервисе его увидит только выбранный специалист.</small></div>` : ''}<div class="privacy-note">${icon('lock')}В демоверсии не указывай личные или чувствительные сведения. Это демонстрационный режим сервера.</div><p class="inline-error" id="booking-error" role="alert"></p><div class="booking-summary"><p>Твоя встреча<strong>${slot ? `${labelDate(slot.day)}, ${slot.time}–${endTime(slot)}` : 'Выбери время в расписании'}</strong></p><button class="btn" type="submit" ${slot ? '' : 'disabled'}>Продолжить ${icon('arrow')}</button></div></form></section></div></div>`;
}

function confirmBooking() {
  const person = specialistById(selectedSpecialist);
  const slot = service.selectedSlot(booking.slotId);
  modal('Проверь свою запись', `<span class="status amber"><i></i>После отправки — подтверждение специалиста</span><div class="modal-summary"><h3>${person.name}</h3><p class="small">${person.role}</p><div class="row">${icon('calendar')}${fullDate(slot.day)}</div><div class="row">${icon('clock')}${slot.time}–${endTime(slot)}</div><div class="row">${icon('pin')}IT.Бирюлево · ${person.room}</div></div>${booking.topic ? `<p class="small">Тема: ${esc(booking.topic)}</p>` : ''}<p class="small gap-top">Запись можно будет отменить или запросить другое время в разделе «Мои консультации».</p><p class="inline-error" id="confirm-error" role="alert"></p><div class="modal-actions"><button class="btn" data-action="submit-booking">Отправить заявку ${icon('check')}</button><button class="btn secondary" data-action="close-modal">Изменить</button></div>`);
}

function success() {
  const item = studentItems().find(item => item.id === lastCreatedId);
  if (!item) return specialistsPage();
  const person = specialistById(item.specialistId);
  const slot = appointmentSlot(item);
  return `<section class="panel success-card"><div class="success-icon">${icon('check')}</div><h1>Заявка отправлена</h1><p>Первый шаг уже сделан. Специалист рассмотрит заявку, а уведомление появится здесь, в IT.Team.</p>${badge(item.status, STATUS)}<div class="success-info"><h3>${person.name}</h3><div class="row">${icon('calendar')}${labelDate(slot.day)} · ${slot.time}–${endTime(slot)}</div><div class="row">${icon('pin')}${person.room} · IT.Бирюлево</div></div>${link('student/my', 'Мои консультации ' + icon('arrow'), 'btn full')}<button class="text-button gap-top" data-switch-role="${person.id}">Показать эту заявку в кабинете специалиста →</button></section>`;
}

function appointmentCard(item) {
  const person = specialistById(item.specialistId);
  const slot = appointmentSlot(item);
  const date = parseDate(slot.day);
  const requested = service.getSlot(item.requestedSlotId);
  return `<article class="panel appointment-card"><div class="date-tile"><strong>${date.getUTCDate()}</strong><span>${date.toLocaleDateString('ru-RU', { month: 'short', timeZone: 'Europe/Moscow' })}</span></div><div><p class="tiny muted">${person.role}</p><h3>${person.name}</h3><div class="appointment-meta"><span>${icon('clock')}${slot.time}–${endTime(slot)}</span><span>${icon('pin')}${person.room}</span></div>${item.topic ? `<p class="topic">${esc(item.topic)}</p>` : ''}${requested ? `<p class="move-note">Запрошено: ${labelDate(requested.day)}, ${requested.time}. Прежнее время сохранено до решения.</p>` : ''}<button class="text-button gap-top" data-student-detail="${item.id}">Подробнее ${icon('chevron')}</button></div><div class="appointment-side">${badge(item.status, STATUS)}${ACTIVE.includes(item.status) && isFuture(item) ? `<div class="appointment-actions">${item.status !== 'reschedule' ? `<button class="btn secondary small-btn" data-reschedule="${item.id}">Перенести</button>` : ''}<button class="btn ghost small-btn" data-cancel="${item.id}">Отменить</button></div>` : ''}</div></article>`;
}

function myAppointments() {
  const upcoming = studentItems().filter(item => ACTIVE.includes(item.status) && isFuture(item));
  const past = studentItems().filter(item => !ACTIVE.includes(item.status) || !isFuture(item));
  const items = (bookingsTab === 'upcoming' ? upcoming : past).sort((a, b) => bookingsTab === 'upcoming' ? slotInstant(appointmentSlot(a)) - slotInstant(appointmentSlot(b)) : slotInstant(appointmentSlot(b)) - slotInstant(appointmentSlot(a)));
  return `<div class="section-heading"><div class="segmented" aria-label="Период консультаций"><button data-bookings-tab="upcoming" class="${bookingsTab === 'upcoming' ? 'active' : ''}">Предстоящие · ${upcoming.length}</button><button data-bookings-tab="past" class="${bookingsTab === 'past' ? 'active' : ''}">История · ${past.length}</button></div>${link('student/specialists', icon('plus') + ' Записаться', 'text-button')}</div><div class="appointment-list">${items.map(appointmentCard).join('') || `<div class="panel">${empty('Здесь пока нет консультаций', bookingsTab === 'upcoming' ? 'Выбери специалиста и подходящее время для встречи.' : 'Завершённые и отменённые записи появятся здесь.', link('student/specialists', 'Выбрать специалиста', 'btn'))}</div>`}</div>`;
}

function notifications() {
  const items = service.state.notifications.filter(item => item.studentId === STUDENT.id);
  return `<div class="section-heading"><h2>Обновления твоих записей</h2><button class="text-button" data-action="read-notifications">Прочитать все ${icon('check')}</button></div><section class="panel" style="padding:0;overflow:hidden">${items.map(item => `<article class="notification ${item.read ? '' : 'unread'}"><span class="icon-box">${icon('bell')}</span><div><p>${esc(item.text)}</p><span class="tiny dim">${timestamp(item.at)}</span></div>${item.read ? '' : '<i class="unread-dot" aria-label="Не прочитано"></i>'}</article>`).join('') || empty('Уведомлений пока нет', 'Изменения статуса консультаций появятся здесь.')}</section>`;
}

function adminOverview() {
  const items = staffItems();
  const pending = items.filter(item => ['pending', 'reschedule'].includes(item.status));
  const confirmed = items.filter(item => item.status === 'confirmed' && isFuture(item));
  const unfinished = items.filter(canComplete);
  const completed = items.filter(item => item.status === 'completed');
  const agenda = confirmed.sort((a, b) => slotInstant(appointmentSlot(a)) - slotInstant(appointmentSlot(b))).slice(0, 5);
  const person = specialistById(role);
  return `<div class="stats">${[
    [pending.length, 'Ожидают решения', 'file', 'amber'],
    [confirmed.length, 'Предстоящие встречи', 'calendar', ''],
    [completed.length, 'Завершено консультаций', 'check', 'green'],
    [service.availableSlots(role).length, 'Свободных интервалов', 'clock', ''],
  ].map(([value, text, symbol, color]) => `<div class="panel stat ${color}"><div><strong>${value}</strong><p>${text}</p></div><span class="icon-box">${icon(symbol)}</span></div>`).join('')}</div>${unfinished.length ? `<div class="highlight-panel"><span class="icon-box">${icon('check')}</span><div><h3>Прошедшие встречи ждут отметки</h3><p>${unfinished.length} консультация: отметьте результат в карточке записи.</p></div><button class="btn secondary small-btn" data-staff-detail="${unfinished[0].id}">Открыть встречу</button></div>` : ''}<div class="admin-columns"><section class="panel"><div class="panel-title"><div><h2>Ближайшие встречи</h2><p>${person.room} · очный приём</p></div>${link('admin/schedule', 'Расписание ' + icon('chevron'), 'text-button')}</div>${agenda.map(item => {
    const slot = appointmentSlot(item);
    return `<div class="agenda-date">${icon('calendar')}${fullDate(slot.day)}</div><div class="agenda-item"><span class="agenda-time">${slot.time}</span><div class="agenda-content"><button data-staff-detail="${item.id}">${esc(item.studentName)}</button><p>${esc(item.group)} · ${slot.duration} минут</p>${badge(item.status, STATUS)}</div></div>`;
  }).join('') || empty('Встреч пока нет', 'Подтверждённые записи появятся в этом списке.')}</section><section class="panel"><div class="panel-title"><h2>Новые обращения</h2><span class="count">${pending.length}</span></div>${pending.slice(0, 3).map(item => `<article class="request-mini"><div class="row between"><h3>${esc(item.studentName)}</h3><span class="tiny dim">${esc(item.group)}</span></div><p>${labelDate(appointmentSlot(item).day)} · ${appointmentSlot(item).time}</p>${badge(item.status, STATUS)}<div class="appointment-actions"><button class="btn small-btn" data-decision="approve" data-appointment="${item.id}">${item.status === 'reschedule' ? 'Принять перенос' : 'Подтвердить'}</button><button class="btn secondary small-btn" data-staff-detail="${item.id}">Подробнее</button></div></article>`).join('') || empty('Всё обработано', 'Новые заявки появятся здесь.')}${pending.length ? link('admin/appointments', 'Все заявки ' + icon('arrow'), 'text-button gap-top') : ''}</section></div><p class="role-note gap-top">${icon('lock')} Отображаются только обращения к вашему специалисту. Содержание других консультаций в этом кабинете недоступно.</p>`;
}

function filteredAdminItems() {
  const query = adminSearch.toLocaleLowerCase('ru-RU');
  return staffItems().filter(item => `${item.studentName} ${item.group}`.toLocaleLowerCase('ru-RU').includes(query) && (!adminStatus || item.status === adminStatus) && (!adminDate || appointmentSlot(item).day === adminDate)).sort((a, b) => slotInstant(appointmentSlot(b)) - slotInstant(appointmentSlot(a)));
}

function adminRows() {
  const items = filteredAdminItems();
  return items.map(item => `<tr><td><button class="student-name" data-staff-detail="${item.id}">${esc(item.studentName)}</button><small>${esc(item.group)}</small></td><td>${labelDate(appointmentSlot(item).day)}<small>${appointmentSlot(item).time}–${endTime(appointmentSlot(item))}</small></td><td>${badge(item.status, STATUS)}</td><td><button class="btn secondary small-btn" data-staff-detail="${item.id}">Открыть ${icon('chevron')}</button></td></tr>`).join('') || '<tr><td colspan="4" class="table-empty">По этим условиям заявок не найдено.</td></tr>';
}

function adminAppointments() {
  return `<div class="filter-bar"><label class="search">${icon('search')}<input id="admin-search" type="search" aria-label="Поиск по имени или группе" placeholder="Имя студента или группа" value="${esc(adminSearch)}"></label><select id="admin-status" aria-label="Фильтр по статусу"><option value="">Все статусы</option>${Object.entries(STATUS).map(([key, value]) => `<option value="${key}" ${adminStatus === key ? 'selected' : ''}>${value.label}</option>`).join('')}</select><input id="admin-date" type="date" aria-label="Фильтр по дате" value="${adminDate}"></div><div class="table-container"><table><thead><tr><th>Студент</th><th>Дата и время</th><th>Статус заявки</th><th>Действие</th></tr></thead><tbody id="admin-rows">${adminRows()}</tbody></table></div><div class="row between gap-top"><p class="table-count" id="admin-result-count">Найдено заявок: ${filteredAdminItems().length}</p><button class="text-button" data-action="clear-filters">Сбросить фильтры</button></div><p class="table-note">Личные комментарии и внутренние заметки показываются только в карточке обращения к вашему специалисту.</p>`;
}

function scheduleWeek() {
  const monday = addDays(scheduleDay, -(parseDate(scheduleDay).getUTCDay() + 6) % 7);
  return `<div class="row between" style="margin-bottom:15px"><button class="icon-button" data-schedule-shift="-7" aria-label="Предыдущая неделя">${icon('back')}</button><strong class="small">${labelDate(monday)} — ${labelDate(addDays(monday, 6))}</strong><button class="icon-button" data-schedule-shift="7" aria-label="Следующая неделя">${icon('chevron')}</button></div><div class="schedule-week">${weekdayNames.map((day, index) => {
    const value = addDays(monday, index);
    return `<button class="${value === scheduleDay ? 'active' : ''}" data-schedule-day="${value}"><small>${day}</small><strong>${parseDate(value).getUTCDate()}</strong></button>`;
  }).join('')}</div>`;
}

function scheduleRows() {
  const rules = service.state.rules[role];
  const slots = service.state.slots.filter(slot => !slot.hidden && slot.specialistId === role && slot.day === scheduleDay).sort((a, b) => a.time.localeCompare(b.time));
  return `<div class="break-tag">${icon('clock')} Перерыв в шаблоне: ${rules.breakStart}–${rules.breakEnd}</div><div class="stack">${slots.map(slot => {
    const item = staffItems().find(item => ACTIVE.includes(item.status) && (item.slotId === slot.id || item.requestedSlotId === slot.id));
    return `<div class="schedule-day"><div class="slot-label"><strong>${slot.time}–${endTime(slot)}</strong><small>${slot.duration} мин.</small></div><div class="schedule-status">${item ? `<span class="booked-label">${item.requestedSlotId === slot.id ? 'Запрос переноса' : 'Занято'}</span><button class="btn secondary small-btn" data-staff-detail="${item.id}">Заявка</button>` : `<span class="tiny dim">Свободно</span><button class="icon-button" data-edit-slot="${slot.id}" aria-label="Изменить интервал ${slot.time}">${icon('note')}</button><button class="icon-button" data-remove-slot="${slot.id}" aria-label="Убрать интервал ${slot.time}">${icon('close')}</button>`}</div></div>`;
  }).join('') || empty('В этот день приёма нет', 'Добавьте отдельный интервал или настройте рабочий график.')}</div>`;
}

function adminSchedule() {
  return `<div class="schedule-layout"><section class="panel"><div class="panel-title"><div><h2>Календарь приёма</h2><p>Управляйте свободными интервалами</p></div><button class="text-button" data-action="schedule-rules">${icon('calendar')} Рабочий график</button></div>${scheduleWeek()}${scheduleRows()}<div class="row between gap-top"><span class="tiny dim">${fullDate(scheduleDay)}</span><button class="text-button" data-action="close-day">Сделать нерабочим</button></div></section><aside class="panel schedule-aside"><div class="panel-title"><div><h2>Добавить время</h2><p>Одна консультация — 45 минут</p></div></div><form data-form="slot"><div class="field"><label for="slot-date">Дата</label><input id="slot-date" name="day" type="date" required min="${today()}" value="${scheduleDay}"></div><div class="field"><label for="slot-time">Начало приёма</label><input id="slot-time" name="time" type="time" required value="10:00"></div><p class="inline-error" id="slot-error" role="alert"></p><button class="btn full" type="submit">${icon('plus')} Добавить интервал</button><div class="info-block">Занятое время нельзя удалить. Сначала перенесите или отмените консультацию в карточке заявки.</div></form></aside></div>`;
}

function historyHtml(item, student = false) {
  const items = student ? item.history.filter(record => record.text !== 'Внутренняя заметка обновлена') : item.history;
  return `<div class="history">${[...items].reverse().map(record => `<div class="history-item"><div><p>${esc(record.text)}</p><small>${timestamp(record.at)} · ${esc(record.actor)}</small></div></div>`).join('')}</div>`;
}

function detailSummary(item) {
  const slot = appointmentSlot(item);
  return `<div class="detail-grid"><div class="detail-cell"><small>Дата</small>${fullDate(slot.day)}</div><div class="detail-cell"><small>Время</small>${slot.time}–${endTime(slot)}</div><div class="detail-cell"><small>Место</small>IT.Бирюлево · ${specialistById(item.specialistId).room}</div><div class="detail-cell"><small>Статус</small>${badge(item.status, STATUS)}</div></div>${item.requestedSlotId ? `<div class="private-box"><div class="row">${icon('calendar')}Запрос на перенос</div>Новое время: ${labelDate(service.getSlot(item.requestedSlotId).day)}, ${service.getSlot(item.requestedSlotId).time}.<br>Прежнее время остаётся закреплённым до решения.</div>` : ''}${item.topic ? `<div class="detail-section"><h3>Тема обращения</h3><p>${esc(item.topic)}</p></div>` : ''}`;
}

function studentDetail(id) {
  const item = studentItems().find(item => item.id === id);
  if (!item) throw new Error('Запись не найдена.');
  modal('Моя консультация', `<div class="row">${avatar(specialistById(item.specialistId), 'small-avatar')}<div><h3>${specialistById(item.specialistId).name}</h3><p class="small">${specialistById(item.specialistId).role}</p></div></div>${detailSummary(item)}${item.privateComment ? `<div class="detail-section"><h3>Твой личный комментарий</h3><p>${esc(item.privateComment)}</p></div>` : ''}<div class="detail-section"><h3>История записи</h3>${historyHtml(item, true)}</div>${ACTIVE.includes(item.status) && isFuture(item) ? `<div class="modal-actions">${item.status !== 'reschedule' ? `<button class="btn" data-reschedule="${item.id}">Запросить перенос</button>` : ''}<button class="btn danger" data-cancel="${item.id}">Отменить запись</button></div>` : ''}`);
}

function staffDetail(id) {
  const item = staffItems().find(item => item.id === id);
  if (!item) throw new Error('Обращение недоступно этому специалисту.');
  modal('Карточка обращения', `<div class="row between"><div><h2>${esc(item.studentName)}</h2><p class="small">${esc(item.group)} · Студент</p></div><span class="icon-box">${icon('file')}</span></div>${detailSummary(item)}${item.privateComment ? `<div class="detail-section"><div class="private-box"><div class="row">${icon('lock')}Личный комментарий · только выбранному специалисту</div>${esc(item.privateComment)}</div></div>` : ''}<div class="modal-actions">${['pending', 'reschedule'].includes(item.status) ? `<button class="btn" data-decision="approve" data-appointment="${id}">${icon('check')}${item.status === 'reschedule' ? 'Подтвердить перенос' : 'Подтвердить'}</button><button class="btn danger" data-decision="reject" data-appointment="${id}">${item.status === 'reschedule' ? 'Отклонить перенос' : 'Отклонить'}</button>` : ''}${ACTIVE.includes(item.status) && isFuture(item) ? `<button class="btn secondary" data-staff-move="${id}">Перенести</button><button class="btn ghost" data-cancel="${id}">Отменить</button>` : ''}${canComplete(item) ? `<button class="btn" data-complete="${id}">${icon('check')}Отметить завершённой</button>` : ''}</div><div class="detail-section"><h3 class="row">${icon('note')} Внутренняя заметка</h3><form class="note-form" data-form="notes" data-appointment="${id}"><div class="field"><label for="staff-notes">Для себя, не отображается студенту</label><textarea id="staff-notes" name="notes" maxlength="2000" placeholder="Вымышленная заметка для демонстрации">${esc(item.internalNotes)}</textarea></div><button class="btn secondary small-btn" type="submit">Сохранить заметку</button></form></div><div class="detail-section"><h3>История действий</h3>${historyHtml(item)}</div>`, true);
}

function rescheduleDialog(id, staff = false) {
  const item = (staff ? staffItems() : studentItems()).find(item => item.id === id);
  if (!item) throw new Error('Заявка недоступна.');
  const available = service.availableSlots(item.specialistId, item.id).filter(slot => slot.id !== item.slotId && slot.id !== item.requestedSlotId);
  movingAppointment = { id, staff };
  const days = [...new Set(available.map(slot => slot.day))];
  const options = day => available.filter(slot => slot.day === day).map(slot => `<option value="${slot.id}">${slot.time}–${endTime(slot)}</option>`).join('');
  modal(staff ? 'Перенести консультацию' : 'Запросить другое время', available.length ? `<p class="small">Сейчас: ${labelDate(appointmentSlot(item).day)}, ${appointmentSlot(item).time}.</p><form data-form="reschedule"><div class="field"><label for="move-day">Новая дата</label><select id="move-day" name="day">${days.map(day => `<option value="${day}">${fullDate(day)}</option>`).join('')}</select></div><div class="field"><label for="move-slot">Новое время</label><select id="move-slot" name="slot" required>${options(days[0])}</select></div><div class="privacy-note">${icon('calendar')}${staff ? 'Время изменится сразу, студент получит уведомление.' : 'Прежнее время останется закреплённым до решения специалиста.'}</div><p class="inline-error" id="move-error" role="alert"></p><div class="modal-actions"><button class="btn" type="submit">${staff ? 'Перенести встречу' : 'Отправить запрос'}</button><button type="button" class="btn secondary" data-action="close-modal">Назад</button></div></form>` : empty('Свободного времени пока нет', 'Попробуйте позже или добавьте интервалы в расписании.'));
}

function scheduleRules() {
  const rules = service.state.rules[role];
  modal('Рабочий график', `<p class="small">Шаблон добавляет свободные интервалы в выбранном периоде. Существующие интервалы и записи сохраняются.</p><form data-form="rules"><div class="form-grid"><div class="field"><label for="rules-from">С даты</label><input id="rules-from" type="date" name="from" value="${today()}" min="${today()}" required></div><div class="field"><label for="rules-until">По дату</label><input id="rules-until" type="date" name="until" value="${addDays(today(), 14)}" min="${today()}" required></div></div><span class="field-label">Рабочие дни</span><div class="week-checkboxes">${weekdayNames.map((name, i) => `<label><input name="weekdays" type="checkbox" value="${weekValues[i]}" ${rules.weekdays.includes(weekValues[i]) ? 'checked' : ''}><span>${name}</span></label>`).join('')}</div><div class="form-grid">${[['start', 'Начало работы'], ['end', 'Конец работы'], ['breakStart', 'Перерыв с'], ['breakEnd', 'Перерыв до']].map(([name, title]) => `<div class="field"><label for="rule-${name}">${title}</label><input id="rule-${name}" type="time" name="${name}" required value="${rules[name]}"></div>`).join('')}</div><div class="info-block">Длительность приёма — 45 минут, шаг начала — 1 час. Уже занятые или пересекающиеся интервалы повторно не добавляются.</div><p class="inline-error" id="rules-error" role="alert"></p><div class="modal-actions"><button class="btn" type="submit">Добавить по графику</button><button type="button" class="btn secondary" data-action="close-modal">Отмена</button></div></form>`);
}

function confirmAction(title, text, action, id) {
  modal(title, `<p class="small">${text}</p><p class="inline-error" id="action-error" role="alert"></p><div class="modal-actions"><button class="btn danger" data-confirm="${action}" data-appointment="${id}">Подтвердить</button><button class="btn secondary" data-action="close-modal">Назад</button></div>`);
}

function updateAdminResults() {
  $('#admin-rows').innerHTML = adminRows();
  $('#admin-result-count').textContent = `Найдено заявок: ${filteredAdminItems().length}`;
}

function handleError(error) {
  const target = $('#dialog-root .inline-error') || $('#module-main .inline-error');
  if (target) target.textContent = error.message || 'Не получилось выполнить действие.';
  else toast(error.message || 'Не получилось выполнить действие.');
}

document.addEventListener('click', async event => {
  const button = event.target.closest('button,[data-backdrop]');
  if (!button || button.disabled) return;
  const data = button.dataset;
  try {
    if (button.hasAttribute('data-backdrop') && button === event.target) return closeModal();
    if (data.switchRole) return changeRole(data.switchRole);
    if (data.bookingDay) { booking.day = data.bookingDay; booking.slotId = ''; render(); return; }
    if (data.bookingSlot) { booking.slotId = data.bookingSlot; render(); return; }
    if (data.monthShift) {
      const date = parseDate(booking.month + '-01'); date.setUTCMonth(date.getUTCMonth() + Number(data.monthShift));
      booking.month = monthKey(dateKey(date));
      booking.day = service.availableSlots(selectedSpecialist).find(slot => monthKey(slot.day) === booking.month)?.day || booking.month + '-01';
      booking.slotId = '';
      render(); return;
    }
    if (data.bookingsTab) { bookingsTab = data.bookingsTab; render(); return; }
    if (data.studentDetail) return studentDetail(data.studentDetail);
    if (data.staffDetail) return staffDetail(data.staffDetail);
    if (data.reschedule) return rescheduleDialog(data.reschedule);
    if (data.staffMove) return rescheduleDialog(data.staffMove, true);
    if (data.cancel) return confirmAction('Отменить консультацию?', 'Запись будет отменена, а время снова станет доступным. История сохранится.', 'cancel', data.cancel);
    if (data.complete) return confirmAction('Завершить консультацию?', 'Встреча будет отмечена как состоявшаяся и останется в истории.', 'complete', data.complete);
    if (data.decision === 'reject') return confirmAction('Отклонить заявку?', 'Если это запрос переноса, прежняя запись сохранится. Студент получит уведомление.', 'reject', data.appointment);
    if (data.decision === 'approve') { await service.decide(data.appointment, role, 'approve'); render(); staffDetail(data.appointment); toast('Решение сохранено. Студент получил уведомление.'); return; }
    if (data.confirm) {
      if (data.confirm === 'cancel') await service.cancel(data.appointment, role);
      if (data.confirm === 'reject') await service.decide(data.appointment, role, 'reject');
      if (data.confirm === 'complete') await service.complete(data.appointment, role);
      if (data.confirm === 'close-day') await service.closeDay(role, scheduleDay);
      if (data.confirm === 'remove-slot') await service.removeSlot(data.appointment, role);
      closeModal(); render(); toast('Изменения сохранены'); return;
    }
    if (data.scheduleDay) { scheduleDay = data.scheduleDay; render(); return; }
    if (data.scheduleShift) { scheduleDay = addDays(scheduleDay, Number(data.scheduleShift)); render(); return; }
    if (data.removeSlot) return confirmAction('Убрать свободный интервал?', 'Студенты больше не смогут выбрать это время для записи.', 'remove-slot', data.removeSlot);
    if (data.editSlot) {
      const slot = service.getSlot(data.editSlot);
      modal('Изменить время приёма', `<form data-form="edit-slot" data-slot="${slot.id}"><div class="field"><label for="edit-day">Дата</label><input id="edit-day" type="date" name="day" min="${today()}" required value="${slot.day}"></div><div class="field"><label for="edit-time">Начало</label><input id="edit-time" type="time" name="time" required value="${slot.time}"></div><p class="inline-error" role="alert"></p><button class="btn" type="submit">Сохранить</button></form>`); return;
    }
    switch (data.action) {
      case 'close-modal': closeModal(); break;
      case 'submit-booking': {
        const item = await service.create({ specialistId: selectedSpecialist, selectedSlotId: booking.slotId, topic: booking.topic, privateComment: booking.privateComment });
        lastCreatedId = item.id; selectedSpecialist = null; booking = { day: '', month: '', slotId: '', topic: '', privateComment: '' }; go('student/success'); break;
      }
      case 'read-notifications': await service.markNotificationsRead(); render(); toast('Все уведомления прочитаны'); break;
      case 'clear-filters': adminSearch = ''; adminStatus = ''; adminDate = ''; render(); break;
      case 'schedule-rules': scheduleRules(); break;
      case 'close-day': confirmAction('Сделать день нерабочим?', `Свободные интервалы на ${labelDate(scheduleDay)} будут удалены. Если есть записи, сначала нужно перенести или отменить их.`, 'close-day', 'day'); break;
      case 'reset-demo': modal('Начать показ заново?', `<p class="small">Все тестовые заявки и настройки этой демонстрационной базы будут заменены исходными примерами.</p><div class="modal-actions"><button class="btn" data-action="reset-confirm">Начать заново</button><button class="btn secondary" data-action="close-modal">Отмена</button></div>`); break;
      case 'reset-confirm': await service.reset(); selectedSpecialist = null; lastCreatedId = null; closeModal(); render(); toast('Демонстрационные данные восстановлены'); break;
      case 'about-demo': modal('О демонстрации', `<h3>Консультации · IT.Team</h3><p class="small gap-top">Наглядный прототип студенческой записи и кабинета психолога. Через переключатель сверху можно показать обе стороны одного сценария.</p><div class="info-block"><strong>Сценарий показа</strong><br>1. Студент выбирает психолога и отправляет заявку.<br>2. Переключитесь на «Психолог» и подтвердите запись.<br>3. Вернитесь к студенту: новый статус и уведомление уже видны.</div><p class="small gap-top">Модуль работает с Python/FastAPI через HTTP. Заявки, проверки и расписание обрабатываются сервером и сохраняются в БД. Демо-переключатель ролей включается отдельно; рабочий режим принимает проверенный JWT IT.Team.</p>`); break;
    }
  } catch (error) { handleError(error); }
});

function changeRole(value) {
  if (value !== 'student' && !specialistById(value)) return;
  role = value;
  adminSearch = ''; adminStatus = ''; adminDate = '';
  go(value === 'student' ? 'student/my' : 'admin/overview');
}

document.addEventListener('change', event => {
  const target = event.target;
  try {
    if (target.id === 'demo-role') changeRole(target.value);
    if (target.id === 'admin-status') { adminStatus = target.value; updateAdminResults(); }
    if (target.id === 'admin-date') { adminDate = target.value; updateAdminResults(); }
    if (target.id === 'move-day' && movingAppointment) {
      const item = service.getAppointment(movingAppointment.id);
      $('#move-slot').innerHTML = service.availableSlots(item.specialistId, item.id).filter(slot => slot.day === target.value && slot.id !== item.slotId && slot.id !== item.requestedSlotId).map(slot => `<option value="${slot.id}">${slot.time}–${endTime(slot)}</option>`).join('');
    }
  } catch (error) { handleError(error); }
});

document.addEventListener('input', event => {
  const target = event.target;
  if (target.dataset.draft) booking[target.dataset.draft] = target.value;
  if (target.id === 'admin-search') { adminSearch = target.value; updateAdminResults(); }
});

document.addEventListener('submit', async event => {
  const form = event.target;
  if (!form.dataset.form) return;
  event.preventDefault();
  const data = new FormData(form);
  try {
    switch (form.dataset.form) {
      case 'booking': booking.topic = String(data.get('topic') || ''); booking.privateComment = String(data.get('privateComment') || ''); confirmBooking(); break;
      case 'notes': await service.saveNotes(form.dataset.appointment, role, String(data.get('notes') || '')); staffDetail(form.dataset.appointment); toast('Внутренняя заметка сохранена'); break;
      case 'reschedule': {
        const item = movingAppointment;
        if (item.staff) await service.move(item.id, role, data.get('slot'));
        else await service.requestReschedule(item.id, data.get('slot'));
        closeModal(); render(); toast(item.staff ? 'Встреча перенесена. Студент получил уведомление.' : 'Запрос на перенос отправлен специалисту'); break;
      }
      case 'slot': await service.addSlot(role, data.get('day'), data.get('time')); scheduleDay = data.get('day'); render(); toast('Время добавлено в расписание'); break;
      case 'edit-slot': await service.updateSlot(form.dataset.slot, role, data.get('day'), data.get('time')); scheduleDay = data.get('day'); closeModal(); render(); toast('Интервал изменён'); break;
      case 'rules': {
        const rules = { start: data.get('start'), end: data.get('end'), breakStart: data.get('breakStart'), breakEnd: data.get('breakEnd'), weekdays: data.getAll('weekdays').map(Number) };
        const added = await service.generateSchedule(role, rules, data.get('from'), data.get('until'));
        scheduleDay = data.get('from'); closeModal(); render(); toast(`Расписание сохранено. Добавлено интервалов: ${added}`); break;
      }
    }
  } catch (error) { handleError(error); }
});

document.addEventListener('keydown', event => {
  if (event.key === 'Escape') closeModal();
  if (event.key !== 'Tab' || !$('#dialog-root').children.length) return;
  const controls = Array.from($('#dialog-root').querySelectorAll('a[href],button,input,select,textarea,[tabindex="0"]')).filter(control => !control.disabled);
  const first = controls[0]; const last = controls.at(-1);
  if (event.shiftKey && (document.activeElement === first || document.activeElement === $('.modal'))) { event.preventDefault(); last?.focus(); }
  else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first?.focus(); }
});

window.addEventListener('hashchange', () => { closeModal(); readRoute().catch(handleError); window.scrollTo(0, 0); });
async function start() {
  try {
    await service.init(window.ITTEAM_ACCESS_TOKEN || '');
    await readRoute();
  } catch (error) {
    $('#consultations-app').innerHTML = `<div class="layout"><section class="panel"><h1>Не удалось подключиться к серверу</h1><p class="gap-top">${esc(error.message)}</p><p class="gap-top">Запустите Python-сервис и <a href="">обновите страницу</a>.</p></section></div>`;
  }
}
